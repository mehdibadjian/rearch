[workspace]
resolver = "2"
members = [
    "crates/rearch-cli",
    "crates/rearch-core",
    "crates/rearch-rea",
    "crates/rearch-proof",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["rearch contributors"]

[workspace.dependencies]
anyhow = "1.0"
askama = "0.12"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
goblin = "0.9"
quick-xml = { version = "0.36", features = ["serialize"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.17"
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
walkdir = "2.5"
